# Copy this file to /etc/modprobe.d/datadev.conf on GPU DAQ nodes and then edit
# to your specific needs.  CPU-only DAQ nodes should use datadev.conf instead.
#
# /etc/modprobe.d is consulted by modprobe, which is how udev loads the module
# when it matches a card (pci:v00001A4Ad00002030).  It is NOT consulted by
# insmod, so a script that insmods the module must pass these on its own
# command line.
#
# These parameters describe the CPU-side DMA buffers only.  The GPU DRP's buffers
# are registered with gpuAddNvidiaMemory() and sized by drp_gpu itself, so cfgSize
# does not bound them.  Both can be in use at once on one card: the GPU DRP takes
# lane 0 and CPU DRPs any other lane, e.g. an ePixUHR3x2 GPU DRP on lane 0 at
# ~200 kB per DMA alongside a timing CPU DRP on lane 1 that is content with 4 kB.
#
#   cfgDevName=1   Name devices by PCI bus number, /dev/datadev_a1 rather than
#                  /dev/datadev_1, so a name cannot shift when a card is added,
#                  removed or re-enumerated.  Default 0.
#   cfgMode=2      BUFF_STREAM: kmalloc + dma_map_single with explicit cache
#                  synchronisation.  Default 1, BUFF_COHERENT.
#   cfgCont=0      Continuation off, so a frame larger than the buffer asserts
#                  the overflow bit in DmaDsc and the remainder is dropped
#                  (AxiStreamDmaV2Write.vhd:325), instead of spanning buffers.
#                  Must be stated; the default is 1.  No DRP reassembles a
#                  continued frame, so continuation can only yield descriptors
#                  the code rejects, whereas overflow is a condition it tests.
#   cfgTxCount=4   Every buffer is allocated separately at cfgSize, so cfgSize
#   cfgRxCount=1020  should be a multiple of the 4 kB page size or the remainder
#   cfgSize=4096   is wasted once per buffer.  The counts sum to 1024, giving
#                  4 MB in exactly 1024 single-page buffers.  Defaults are
#                  1024, 1024 and 0x20000 (128 kB), i.e. 256 MB.  4 kB suits a
#                  timing DRP; raise it for a CPU lane carrying real payloads.
#
# Installers are expected to adjust these per machine.

options datadev cfgDevName=1 cfgMode=2 cfgCont=0 cfgTxCount=4 cfgRxCount=1020 cfgSize=4096
